apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rl-xapp.fullname" . }}-code
  labels:
    {{- include "rl-xapp.labels" . | nindent 4 }}
data:
  xapp.py: |
    """
    RL xApp — Closed-loop PRB slicing conforme au papier REAL (arXiv:2502.00715).

    Algorithmes : PPO ou DQN (stable-baselines3), sélectionnable via RL_ALGO.
    Slices      : eMBB (4 UEs), URLLC (4 UEs), mMTC (4 UEs) = 12 UEs total.
    Interface   : E2SM-KPM (sampling 500ms) + E2SM-RC (quota PRBs par slice).
    Récompense  : R = α_eMBB·r_eMBB + α_URLLC·r_URLLC + α_mMTC·r_mMTC
                  r_slice = max(-1, thr_reçu/thr_cible - 1)  ∈ [-1, 0]
    """
    import os, time, json, logging, requests
    import numpy as np
    import gymnasium as gym
    from gymnasium import spaces
    from stable_baselines3 import PPO, DQN
    from stable_baselines3.common.env_checker import check_env

    logging.basicConfig(level=logging.INFO,
                        format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger("rl-xapp")

    # ── Configuration ────────────────────────────────────────────────────────
    RIC_HOST        = os.getenv("RIC_HOST",        "osc-ric-e2mgr")
    RIC_PORT        = os.getenv("RIC_PORT",        "3800")
    SUBMGR_HOST     = os.getenv("SUBMGR_HOST",     "osc-ric-submgr")
    SUBMGR_PORT     = os.getenv("SUBMGR_PORT",     "8088")
    KPM_ADAPTER_URL = os.getenv("KPM_ADAPTER_URL", "http://localhost:8080")
    TOTAL_TIMESTEPS = int(os.getenv("TOTAL_TIMESTEPS", "1000000"))

    # Algorithme RL : "PPO" ou "DQN"
    RL_ALGO = os.getenv("RL_ALGO", "PPO").upper()

    # Sampling KPM — papier REAL utilise 500ms
    KPM_SAMPLE_MS = int(os.getenv("KPM_SAMPLE_MS", "500"))

    # Débit cible par slice (Mbps)
    EMBB_TARGET  = float(os.getenv("EMBB_TARGET_MBPS",  "50"))
    URLLC_TARGET = float(os.getenv("URLLC_TARGET_MBPS", "20"))
    MMTC_TARGET  = float(os.getenv("MMTC_TARGET_MBPS",   "5"))

    # Poids α par slice — papier : α_URLLC > α_eMBB ≥ α_mMTC
    ALPHA_EMBB  = float(os.getenv("ALPHA_EMBB",  "0.3"))
    ALPHA_URLLC = float(os.getenv("ALPHA_URLLC", "0.5"))
    ALPHA_MMTC  = float(os.getenv("ALPHA_MMTC",  "0.2"))

    TOTAL_PRB = int(os.getenv("TOTAL_PRB", "106"))
    E2MGR_URL = f"http://{RIC_HOST}:{RIC_PORT}"
    SUBMGR_URL = f"http://{SUBMGR_HOST}:{SUBMGR_PORT}"

    # ── Fonction de récompense (papier REAL, section IV-B) ───────────────────
    def slice_reward(thr_received: float, thr_target: float) -> float:
        """
        r_slice = max(-1,  thr_received / thr_target  - 1)
        • thr_received >= thr_target  →  r = 0   (objectif atteint)
        • thr_received = 0            →  r = -1  (plancher)
        Résultat dans [-1, 0] → évite gradients explosifs.
        """
        return float(max(-1.0, thr_received / max(thr_target, 1e-6) - 1.0))

    def total_reward(thr: np.ndarray) -> float:
        """R = α_eMBB·r_eMBB + α_URLLC·r_URLLC + α_mMTC·r_mMTC"""
        r_embb  = slice_reward(thr[0], EMBB_TARGET)
        r_urllc = slice_reward(thr[1], URLLC_TARGET)
        r_mmtc  = slice_reward(thr[2], MMTC_TARGET)
        return ALPHA_EMBB * r_embb + ALPHA_URLLC * r_urllc + ALPHA_MMTC * r_mmtc

    # ── Environnement Gymnasium ──────────────────────────────────────────────
    class PRBSlicingEnv(gym.Env):
        """
        Observation (6 valeurs) :
          [thr_embb/200, thr_urllc/200, thr_mmtc/200,
           prb_embb/106, prb_urllc/106, prb_mmtc/106]

        Action (Discrete 7) — transfert de PRB_STEP PRBs entre slices :
          0=no-op
          1=eMBB→URLLC   2=URLLC→eMBB
          3=eMBB→mMTC    4=mMTC→eMBB
          5=URLLC→mMTC   6=mMTC→URLLC

        PRB_STEP = 10 PRBs par action (~10% de la bande 20 MHz).
        Minimum par slice = 5 PRBs.
        """
        metadata = {"render_modes": []}

        PRB_STEP = 10
        PRB_MIN  = 5

        def __init__(self):
            super().__init__()
            self.observation_space = spaces.Box(
                low=0.0, high=1.0, shape=(6,), dtype=np.float32)
            self.action_space = spaces.Discrete(7)
            # Allocation initiale : 40/40/26 PRBs
            self.prb = np.array([40.0, 40.0, 26.0], dtype=np.float32)
            self._gnb_id = None

        # ── KPM adapter ──────────────────────────────────────────────────────
        def _wait_adapter(self, retries=30, delay=3):
            for i in range(retries):
                try:
                    if requests.get(f"{KPM_ADAPTER_URL}/health",
                                    timeout=2).status_code == 200:
                        log.info("kpm-adapter prêt.")
                        return
                except Exception:
                    pass
                log.info(f"Attente kpm-adapter {i+1}/{retries}...")
                time.sleep(delay)

        def _fetch_kpis(self):
            """
            Lit débit DL par slice depuis le kpm-adapter.
            Bloque KPM_SAMPLE_MS ms (500ms par défaut, conforme papier).
            """
            time.sleep(KPM_SAMPLE_MS / 1000.0)
            gnb = self._gnb_id or "gnb"
            try:
                r = requests.get(
                    f"{KPM_ADAPTER_URL}/v1/nodeb/{gnb}/kpm", timeout=3)
                if r.status_code != 200:
                    raise ValueError(f"HTTP {r.status_code}")
                d = r.json()
                return np.array([
                    d.get("embb_dl_mbps",  0.0),
                    d.get("urllc_dl_mbps", 0.0),
                    d.get("mmtc_dl_mbps",  0.0),
                ], dtype=np.float32)
            except Exception as e:
                log.warning(f"_fetch_kpis: {e}")
                return np.zeros(3, dtype=np.float32)

        # ── RIC ──────────────────────────────────────────────────────────────
        def _get_gnb(self):
            try:
                r = requests.get(f"{E2MGR_URL}/v1/nodeb/states", timeout=5)
                nodes = [n["inventoryName"] for n in r.json()
                         if n.get("connectionStatus") == "CONNECTED"]
                return nodes[0] if nodes else None
            except Exception as e:
                log.warning(f"_get_gnb: {e}")
                return None

        def _subscribe_kpm(self, gnb_id):
            """RIC Subscription Request — E2SM-KPM Style 4, période 500ms."""
            payload = {
                "SubscriptionId": "",
                "ClientEndpoint": {
                    "Host": "rl-xapp", "HTTPPort": 8080, "RMRPort": 4560},
                "Meid": gnb_id,
                "RANFunctionID": 2,
                "SubscriptionDetails": [{
                    "RequestId": {"RequestorId": 1, "InstanceId": 0},
                    "EventTriggers": [KPM_SAMPLE_MS],
                    "ActionToBeSetupList": [{
                        "ActionId": 0,
                        "ActionType": "report",
                        "ActionDefinition": {
                            "StyleType": 4,
                            "ActionDefinitionFormat4": {
                                "MatchingUEidList": [],
                                "SubscriptionInfo": 0
                            }
                        }
                    }]
                }]
            }
            try:
                r = requests.post(
                    f"{SUBMGR_URL}/ric/v1/subscriptions",
                    json=payload, timeout=5)
                log.info(f"KPM subscription: {r.status_code}")
            except Exception as e:
                log.warning(f"_subscribe_kpm: {e}")

        def _send_rc(self, prb_alloc):
            """
            RIC Control Request — E2SM-RC Style 2.
            Envoie le quota PRBs par slice au gNB.
            Distribution interne par slice :
              1) Équitable entre les UEs de la slice.
              2) PRBs restants → UEs avec plus forte perte de trajet.
              (Le gNB gère la distribution interne via le scheduler.)
            """
            if not self._gnb_id:
                return
            payload = {
                "RanFunctionId": 3,
                "RicControlAckRequest": "NO_ACK",
                "RicControlHeader": {"ControlActionId": 1,
                                     "UEId": {"GNbUEId": {
                                         "AMFUENGAPId": 0, "GUAMI": {}}}},
                "RicControlMessage": {
                    "StyleType": 2,
                    "RicControlMessageFormat2": {
                        "SlicePRBQuota": [
                            {"SNSSAI": {"SST": 1, "SD": "000001"},
                             "PRBQuota": int(prb_alloc[0])},
                            {"SNSSAI": {"SST": 1, "SD": "000002"},
                             "PRBQuota": int(prb_alloc[1])},
                            {"SNSSAI": {"SST": 1, "SD": "000003"},
                             "PRBQuota": int(prb_alloc[2])},
                        ]
                    }
                }
            }
            try:
                requests.post(
                    f"{E2MGR_URL}/v1/nodeb/{self._gnb_id}/rc-control",
                    json=payload, timeout=5)
            except Exception as e:
                log.warning(f"_send_rc: {e}")

        # ── Gymnasium API ─────────────────────────────────────────────────────
        def reset(self, seed=None, options=None):
            super().reset(seed=seed)
            self.prb = np.array([40.0, 40.0, 26.0], dtype=np.float32)
            self._wait_adapter()
            self._gnb_id = self._get_gnb()
            if self._gnb_id:
                self._subscribe_kpm(self._gnb_id)
                log.info(f"gNB connecté : {self._gnb_id}")
            else:
                log.warning("Aucun gNB connecté au RIC")
            return self._obs(np.zeros(3)), {}

        def step(self, action):
            # 1. Appliquer le transfert de PRBs
            transfers = [
                None,
                (0, 1), (1, 0),
                (0, 2), (2, 0),
                (1, 2), (2, 1),
            ]
            t = transfers[action]
            if t is not None:
                src, dst = t
                if self.prb[src] - self.PRB_STEP >= self.PRB_MIN:
                    self.prb[src] -= self.PRB_STEP
                    self.prb[dst] += self.PRB_STEP

            # 2. Envoyer quota PRBs au gNB
            self._send_rc(self.prb)

            # 3. Attendre le prochain sample KPM (500ms)
            thr = self._fetch_kpis()

            # 4. Récompense conforme papier REAL
            r = total_reward(thr)

            log.info(
                f"algo={RL_ALGO} act={action} "
                f"PRB={self.prb.astype(int).tolist()} "
                f"thr={thr.round(2).tolist()} "
                f"r={r:.4f} "
                f"[r_embb={slice_reward(thr[0],EMBB_TARGET):.2f} "
                f"r_urllc={slice_reward(thr[1],URLLC_TARGET):.2f} "
                f"r_mmtc={slice_reward(thr[2],MMTC_TARGET):.2f}]"
            )
            return self._obs(thr), r, False, False, {}

        def _obs(self, thr):
            return np.array([
                min(thr[0] / 200.0, 1.0),
                min(thr[1] / 200.0, 1.0),
                min(thr[2] / 200.0, 1.0),
                self.prb[0] / TOTAL_PRB,
                self.prb[1] / TOTAL_PRB,
                self.prb[2] / TOTAL_PRB,
            ], dtype=np.float32)

    # ── Main ─────────────────────────────────────────────────────────────────
    def main():
        log.info(f"=== RL xApp démarrage (algo={RL_ALGO}) ===")
        log.info(f"Targets: eMBB={EMBB_TARGET}Mbps  URLLC={URLLC_TARGET}Mbps  mMTC={MMTC_TARGET}Mbps")
        log.info(f"Alpha:   eMBB={ALPHA_EMBB}  URLLC={ALPHA_URLLC}  mMTC={ALPHA_MMTC}")
        log.info(f"KPM sample: {KPM_SAMPLE_MS}ms  |  Steps: {TOTAL_TIMESTEPS}")

        env = PRBSlicingEnv()
        check_env(env, warn=True)

        ppo_kwargs = dict(
            policy="MlpPolicy", env=env, verbose=1,
            learning_rate=float(os.getenv("PPO_LR",     "3e-4")),
            n_steps=       int(os.getenv("PPO_N_STEPS", "128")),
            batch_size=    int(os.getenv("PPO_BATCH",    "64")),
            n_epochs=      int(os.getenv("PPO_N_EPOCHS", "10")),
            gamma=         float(os.getenv("PPO_GAMMA",  "0.99")),
            clip_range=    float(os.getenv("PPO_CLIP",   "0.2")),
        )
        dqn_kwargs = dict(
            policy="MlpPolicy", env=env, verbose=1,
            learning_rate=     float(os.getenv("DQN_LR",          "1e-3")),
            batch_size=        int(os.getenv("DQN_BATCH",          "64")),
            gamma=             float(os.getenv("DQN_GAMMA",        "0.99")),
            exploration_fraction=float(os.getenv("DQN_EXPL_FRAC", "0.1")),
            exploration_final_eps=float(os.getenv("DQN_EXPL_EPS", "0.05")),
            target_update_interval=int(os.getenv("DQN_TARGET_UPD","1000")),
        )

        if RL_ALGO == "DQN":
            model = DQN(**dqn_kwargs)
        else:
            model = PPO(**ppo_kwargs)

        model.learn(total_timesteps=TOTAL_TIMESTEPS)
        path = f"/tmp/{RL_ALGO.lower()}_rl_xapp"
        model.save(path)
        log.info(f"Modèle sauvegardé : {path}.zip")

    if __name__ == "__main__":
        main()
