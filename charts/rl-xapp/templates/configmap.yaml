    """
    RL xApp — Closed-loop PRB slicing conforme au papier REAL (arXiv:2502.00715).

    Algorithmes : PPO ou DQN (stable-baselines3), sélectionnable via RL_ALGO.
    Slices      : eMBB (4 UEs), URLLC (4 UEs), mMTC (4 UEs) = 12 UEs total.
    Interface   : E2SM-KPM (sampling 500ms) + E2SM-RC (quota PRBs par slice).
    Récompense  : R = α_eMBB·r_eMBB + α_URLLC·r_URLLC + α_mMTC·r_mMTC
                  r_slice = max(-1, thr_reçu/thr_cible - 1)  ∈ [-1, 0]
    """
    import os, time, json, logging, requests
    import numpy as np
    import gymnasium as gym
    from gymnasium import spaces
    from stable_baselines3 import PPO, DQN
    from stable_baselines3.common.env_checker import check_env

    logging.basicConfig(level=logging.INFO,
                        format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger("rl-xapp")

    # ── Configuration ────────────────────────────────────────────────────────
    RIC_HOST        = os.getenv("RIC_HOST",        "osc-ric-e2mgr")
    RIC_PORT        = os.getenv("RIC_PORT",        "3800")
    SUBMGR_HOST     = os.getenv("SUBMGR_HOST",     "osc-ric-submgr")
    SUBMGR_PORT     = os.getenv("SUBMGR_PORT",     "8088")
    KPM_ADAPTER_URL = os.getenv("KPM_ADAPTER_URL", "http://localhost:8080")
    TOTAL_TIMESTEPS = int(os.getenv("TOTAL_TIMESTEPS", "1000000"))

    RL_ALGO = os.getenv("RL_ALGO", "PPO").upper()
    KPM_SAMPLE_MS = int(os.getenv("KPM_SAMPLE_MS", "500"))

    EMBB_TARGET  = float(os.getenv("EMBB_TARGET_MBPS",  "50"))
    URLLC_TARGET = float(os.getenv("URLLC_TARGET_MBPS", "20"))
    MMTC_TARGET  = float(os.getenv("MMTC_TARGET_MBPS",   "5"))

    ALPHA_EMBB  = float(os.getenv("ALPHA_EMBB",  "0.3"))
    ALPHA_URLLC = float(os.getenv("ALPHA_URLLC", "0.5"))
    ALPHA_MMTC  = float(os.getenv("ALPHA_MMTC",  "0.2"))

    TOTAL_PRB = int(os.getenv("TOTAL_PRB", "106"))
    E2MGR_URL = f"http://{RIC_HOST}:{RIC_PORT}"
    SUBMGR_URL = f"http://{SUBMGR_HOST}:{SUBMGR_PORT}"

    def slice_reward(thr_received: float, thr_target: float) -> float:
        return float(max(-1.0, thr_received / max(thr_target, 1e-6) - 1.0))

    def total_reward(thr: np.ndarray) -> float:
        r_embb  = slice_reward(thr[0], EMBB_TARGET)
        r_urllc = slice_reward(thr[1], URLLC_TARGET)
        r_mmtc  = slice_reward(thr[2], MMTC_TARGET)
        return ALPHA_EMBB * r_embb + ALPHA_URLLC * r_urllc + ALPHA_MMTC * r_mmtc

    class PRBSlicingEnv(gym.Env):
        metadata = {"render_modes": []}
        PRB_STEP = 10
        PRB_MIN  = 5

        def __init__(self):
            super().__init__()
            self.observation_space = spaces.Box(
                low=0.0, high=1.0, shape=(6,), dtype=np.float32)
            self.action_space = spaces.Discrete(7)
            self.prb = np.array([40.0, 40.0, 26.0], dtype=np.float32)
            self._gnb_id = None

        def _wait_adapter(self, retries=30, delay=3):
            for i in range(retries):
                try:
                    if requests.get(f"{KPM_ADAPTER_URL}/health",
                                    timeout=2).status_code == 200:
                        log.info("kpm-adapter prêt.")
                        return
                except Exception:
                    pass
                log.info(f"Attente kpm-adapter {i+1}/{retries}...")
                time.sleep(delay)

        def _fetch_kpis(self):
            time.sleep(KPM_SAMPLE_MS / 1000.0)
            gnb = self._gnb_id or "gnb"
            try:
                r = requests.get(
                    f"{KPM_ADAPTER_URL}/v1/nodeb/{gnb}/kpm", timeout=3)
                if r.status_code != 200:
                    raise ValueError(f"HTTP {r.status_code}")
                d = r.json()
                return np.array([
                    d.get("embb_dl_mbps",  0.0),
                    d.get("urllc_dl_mbps", 0.0),
                    d.get("mmtc_dl_mbps",  0.0),
                ], dtype=np.float32)
            except Exception as e:
                log.warning(f"_fetch_kpis: {e}")
                return np.zeros(3, dtype=np.float32)

        def _get_gnb(self):
            try:
                r = requests.get(f"{E2MGR_URL}/v1/nodeb/states", timeout=5)
                nodes = [n["inventoryName"] for n in r.json()
                         if n.get("connectionStatus") == "CONNECTED"]
                return nodes[0] if nodes else None
            except Exception as e:
                log.warning(f"_get_gnb: {e}")
                return None

        def _subscribe_kpm(self, gnb_id):
            payload = {
                "SubscriptionId": "",
                "ClientEndpoint": {
                    "Host": "rl-xapp", "HTTPPort": 8080, "RMRPort": 4560},
                "Meid": gnb_id,
                "RANFunctionID": 2,
                "SubscriptionDetails": [{
                    "RequestId": {"RequestorId": 1, "InstanceId": 0},
                    "EventTriggers": [KPM_SAMPLE_MS],
                    "ActionToBeSetupList": [{
                        "ActionId": 0,
                        "ActionType": "report",
                        "ActionDefinition": {
                            "StyleType": 4,
                            "ActionDefinitionFormat4": {
                                "MatchingUEidList": [],
                                "SubscriptionInfo": 0
                            }
                        }
                    }]
                }]
            }
            try:
                r = requests.post(
                    f"{SUBMGR_URL}/ric/v1/subscriptions",
                    json=payload, timeout=5)
                log.info(f"KPM subscription: {r.status_code}")
            except Exception as e:
                log.warning(f"_subscribe_kpm: {e}")

        def _send_rc(self, prb_alloc):
            if not self._gnb_id:
                return
            payload = {
                "RanFunctionId": 3,
                "RicControlAckRequest": "NO_ACK",
                "RicControlHeader": {"ControlActionId": 1,
                                     "UEId": {"GNbUEId": {
                                         "AMFUENGAPId": 0, "GUAMI": {}}}},
                "RicControlMessage": {
                    "StyleType": 2,
                    "RicControlMessageFormat2": {
                        "SlicePRBQuota": [
                            {"SNSSAI": {"SST": 1, "SD": "000001"},
                             "PRBQuota": int(prb_alloc[0])},
                            {"SNSSAI": {"SST": 1, "SD": "000002"},
                             "PRBQuota": int(prb_alloc[1])},
                            {"SNSSAI": {"SST": 1, "SD": "000003"},
                             "PRBQuota": int(prb_alloc[2])},
                        ]
                    }
                }
            }
            try:
                requests.post(
                    f"{E2MGR_URL}/v1/nodeb/{self._gnb_id}/rc-control",
                    json=payload, timeout=5)
            except Exception as e:
                log.warning(f"_send_rc: {e}")

        def reset(self, seed=None, options=None):
            super().reset(seed=seed)
            self.prb = np.array([40.0, 40.0, 26.0], dtype=np.float32)
            self._wait_adapter()
            self._gnb_id = self._get_gnb()
            if self._gnb_id:
                self._subscribe_kpm(self._gnb_id)
                log.info(f"gNB connecté : {self._gnb_id}")
            else:
                log.warning("Aucun gNB connecté au RIC")
            return self._obs(np.zeros(3)), {}

        def step(self, action):
            transfers = [
                None,
                (0, 1), (1, 0),
                (0, 2), (2, 0),
                (1, 2), (2, 1),
            ]
            t = transfers[action]
            if t is not None:
                src, dst = t
                if self.prb[src] - self.PRB_STEP >= self.PRB_MIN:
                    self.prb[src] -= self.PRB_STEP
                    self.prb[dst] += self.PRB_STEP

            self._send_rc(self.prb)
            thr = self._fetch_kpis()
            r = total_reward(thr)

            log.info(
                f"algo={RL_ALGO} act={action} "
                f"PRB={self.prb.astype(int).tolist()} "
                f"thr={thr.round(2).tolist()} "
                f"r={r:.4f}"
            )
            return self._obs(thr), r, False, False, {}

        def _obs(self, thr):
            return np.array([
                min(thr[0] / 200.0, 1.0),
                min(thr[1] / 200.0, 1.0),
                min(thr[2] / 200.0, 1.0),
                self.prb[0] / TOTAL_PRB,
                self.prb[1] / TOTAL_PRB,
                self.prb[2] / TOTAL_PRB,
            ], dtype=np.float32)

    def main():
        log.info(f"=== RL xApp démarrage (algo={RL_ALGO}) ===")
        env = PRBSlicingEnv()
        check_env(env, warn=True)

        ppo_kwargs = dict(
            policy="MlpPolicy", env=env, verbose=1,
            learning_rate=float(os.getenv("PPO_LR",     "3e-4")),
            n_steps=       int(os.getenv("PPO_N_STEPS", "128")),
            batch_size=    int(os.getenv("PPO_BATCH",    "64")),
            n_epochs=      int(os.getenv("PPO_N_EPOCHS", "10")),
            gamma=         float(os.getenv("PPO_GAMMA",  "0.99")),
            clip_range=    float(os.getenv("PPO_CLIP",   "0.2")),
        )
        dqn_kwargs = dict(
            policy="MlpPolicy", env=env, verbose=1,
            learning_rate=     float(os.getenv("DQN_LR",          "1e-3")),
            batch_size=        int(os.getenv("DQN_BATCH",          "64")),
            gamma=             float(os.getenv("DQN_GAMMA",        "0.99")),
            exploration_fraction=float(os.getenv("DQN_EXPL_FRAC", "0.1")),
            exploration_final_eps=float(os.getenv("DQN_EXPL_EPS", "0.05")),
            target_update_interval=int(os.getenv("DQN_TARGET_UPD","1000")),
        )

        model = DQN(**dqn_kwargs) if RL_ALGO == "DQN" else PPO(**ppo_kwargs)
        model.learn(total_timesteps=TOTAL_TIMESTEPS)
        path = f"/tmp/{RL_ALGO.lower()}_rl_xapp"
        model.save(path)
        log.info(f"Modèle sauvegardé : {path}.zip")

    if __name__ == "__main__":
        main()
  kpm_adapter.py: |
    #!/usr/bin/env python3
    """
    KPM Adapter — pont entre les métriques srsRAN (WebSocket JSON) et le xApp RL.
    
    Rôle :
      1. Se connecte au WebSocket du gNB (port 8001, commande metrics_subscribe)
      2. Parse le JSON srsRAN : par cellule, par UE, avec s_nssai (slice)
      3. Agrège les métriques par slice (eMBB, URLLC, mMTC)
      4. Expose une API REST sur :8080 que le xApp PPO interroge
    
    API exposée :
      GET /v1/nodeb/{gnb_id}/kpm  →  { embb_dl_mbps, urllc_dl_mbps, mmtc_dl_mbps, ... }
      GET /health                 →  { status: ok }
      GET /metrics/raw            →  dernier JSON brut srsRAN
    """
    
    import os
    import json
    import logging
    import threading
    from collections import defaultdict
    from contextlib import suppress
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from time import sleep
    
    import websocket
    
    logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger("kpm-adapter")
    
    WS_URL    = os.getenv("WS_URL", "srsran-gnb-metrics:8001")
    REST_PORT = int(os.getenv("REST_PORT", "8080"))
    TOTAL_PRB = int(os.getenv("TOTAL_PRB", "106"))
    
    _default_slice_map = {"1:000001": "embb", "1:000002": "urllc", "1:000003": "mmtc"}
    SLICE_MAP = json.loads(os.getenv("SLICE_MAP", json.dumps(_default_slice_map)))
    SST_FALLBACK = {"1": "embb", "2": "urllc", "3": "mmtc"}
    
    _lock = threading.Lock()
    _raw  = {}
    _kpm  = {}
    
    
    def _slice_name(s_nssai: dict) -> str:
        if not s_nssai:
            return "embb"  # srsRAN_Project doesn't report s_nssai per-UE; default to embb
        sst = str(s_nssai.get("sst", ""))
        sd  = str(s_nssai.get("sd", ""))
        key = f"{sst}:{sd}" if sd else sst
        return SLICE_MAP.get(key) or SST_FALLBACK.get(sst, "embb")
    
    
    def _aggregate(data: dict) -> dict:
        slices = defaultdict(lambda: {
            "dl_brate_sum": 0.0,
            "sinr_sum":     0.0,
            "ue_count":     0,
            "prb_usage":    0.0,
            "cell_count":   0,
            "dl_ok":        0,
            "dl_nok":       0,
        })
    
        cells = data.get("cells", [])
        # accept both list (srsRAN_Project format) and legacy dict keyed by cell_id
        if isinstance(cells, dict):
            cells = list(cells.values())
    
        for cell in cells:
            ue_list = cell.get("ue_list", [])
            if isinstance(ue_list, dict):
                ue_list = list(ue_list.values())
    
            for ue in ue_list:
                name = _slice_name(ue.get("s_nssai", {}))
                s = slices[name]
                s["dl_brate_sum"] += float(ue.get("dl_brate", 0))
                # srsRAN_Project uses pucch_snr_db (not pusch_snr_db)
                sinr = ue.get("pucch_snr_db") or ue.get("pusch_snr_db") or 0
                s["sinr_sum"]     += float(sinr)
                s["dl_ok"]        += int(ue.get("dl_nof_ok",  0))
                s["dl_nok"]       += int(ue.get("dl_nof_nok", 0))
                s["ue_count"]     += 1
            # cell_metrics is a sub-dict in srsRAN_Project cells format
            cm = cell.get("cell_metrics", {})
            if not cm:
                cm = cell  # fallback: dl_prb_usage directly in cell
            # srsRAN_Project cell_metrics fields (confirmed from WebSocket inspection):
            # pucch_tot_rb_usage_avg is the only RB usage metric exposed (fraction 0-1)
            prb_dl = float(
                cm.get("pucch_tot_rb_usage_avg")  # srsRAN_Project ≥ 2024 (fraction 0-1)
                or cm.get("dl_prb_usage")          # legacy / other builds
                or cm.get("dl_prb_utilization")
                or 0
            )
            for s in slices.values():
                s["prb_usage"]  += prb_dl
                s["cell_count"] += 1
    
        result = {}
        for slice_name in ("embb", "urllc", "mmtc"):
            s = slices[slice_name]
            ue_n   = max(s["ue_count"], 1)
            cell_n = max(s["cell_count"], 1)
            dl_total = s["dl_ok"] + s["dl_nok"]
            result[f"{slice_name}_dl_mbps"]   = round(s["dl_brate_sum"] / 1e6, 3)
            result[f"{slice_name}_sinr_db"]   = round(s["sinr_sum"] / ue_n, 2)
            result[f"{slice_name}_prb_usage"] = round(s["prb_usage"] / cell_n, 4)
            result[f"{slice_name}_ue_count"]  = s["ue_count"]
            result[f"{slice_name}_bler"]      = round(
                s["dl_nok"] / dl_total if dl_total > 0 else 0.0, 4)
        return result
    
    
    def _on_open(ws):
        log.info(f"Connecté au gNB WebSocket ({WS_URL})")
        ws.send(json.dumps({"cmd": "metrics_subscribe"}))
    
    
    _seen_key_sets = set()
    
    def _on_message(_ws, message):
        try:
            data = json.loads(message)
        except json.JSONDecodeError:
            return
        # srsRAN_Project sends either a dict or a bare list of cells
        if isinstance(data, list):
            data = {"cells": data}
        elif not isinstance(data, dict):
            return
        if "cmd" in data:
            return
        # Log each unique top-level key structure once for debugging
        key_sig = frozenset(data.keys())
        if key_sig not in _seen_key_sets:
            _seen_key_sets.add(key_sig)
            log.info(f"New message type: {sorted(data.keys())}")
            for k, v in data.items():
                if isinstance(v, dict):
                    log.info(f"  {k} sub-keys: {sorted(v.keys())}")
                elif isinstance(v, list) and v and isinstance(v[0], dict):
                    log.info(f"  {k}[0] keys: {sorted(v[0].keys())}")
                    # Log cell_metrics and ue_list[0] keys for field discovery
                    cm = v[0].get("cell_metrics")
                    if isinstance(cm, dict):
                        log.info(f"    cell_metrics keys: {sorted(cm.keys())}")
                        log.info(f"    cell_metrics vals: { {kk: cm[kk] for kk in list(cm.keys())[:8]} }")
                    ue_list = v[0].get("ue_list", [])
                    if ue_list and isinstance(ue_list[0], dict):
                        log.info(f"    ue_list[0] keys: {sorted(ue_list[0].keys())}")
                        log.info(f"    ue_list[0] vals: { {kk: ue_list[0][kk] for kk in list(ue_list[0].keys())[:8]} }")
        # Only update KPM from cells messages (other types overwrite with zeros)
        if "cells" not in data:
            return
        kpm = _aggregate(data)
        with _lock:
            _raw.clear(); _raw.update(data)
            _kpm.clear(); _kpm.update(kpm)
    
    
    def _on_error(_ws, error):
        log.warning(f"WebSocket error : {error}")
    
    
    def _on_close(_ws, *_):
        log.info("WebSocket fermé, reconnexion dans 2s...")
    
    
    def _ws_loop():
        while True:
            ws = websocket.WebSocketApp(
                f"ws://{WS_URL}",
                on_open=_on_open, on_message=_on_message,
                on_error=_on_error, on_close=_on_close,
            )
            ws.run_forever()
            sleep(2)
    
    
    class KPMHandler(BaseHTTPRequestHandler):
        def log_message(self, *_): pass
    
        def _send_json(self, code, body):
            payload = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)
    
        def do_GET(self):
            path = self.path.rstrip("/")
            if path == "/health":
                self._send_json(200, {"status": "ok", "ws_url": WS_URL})
            elif path == "/metrics/raw":
                with _lock: data = dict(_raw)
                self._send_json(200, data)
            elif "/kpm" in path:
                with _lock: data = dict(_kpm)
                if not data:
                    self._send_json(503, {"error": "no KPM data yet"})
                else:
                    self._send_json(200, data)
            else:
                self._send_json(404, {"error": "not found"})
    
    
    def _rest_loop():
        server = HTTPServer(("0.0.0.0", REST_PORT), KPMHandler)
        log.info(f"REST API démarrée sur :{REST_PORT}")
        server.serve_forever()
    
    
    if __name__ == "__main__":
        log.info(f"KPM Adapter — WS={WS_URL}  REST=:{REST_PORT}  TOTAL_PRB={TOTAL_PRB}")
        threading.Thread(target=_rest_loop, daemon=True).start()
        _ws_loop()
