apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srsran-ue.fullname" . }}-{{ .Release.Name }}
  labels:
    {{- include "srsran-ue.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "srsran-ue.selectorLabels" . | nindent 6 }}
  replicas: 1
  template:
    metadata:
      labels:
        {{- include "srsran-ue.selectorLabels" . | nindent 8 }}
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          [{ "name": "n3network", "interface": "n3", "ips": [ "{{ .Values.ueIp }}/24" ] }]
    spec:
      containers:
        - name: ue
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_NICE", "IPC_LOCK", "CAP_NET_ADMIN"]
          command: ["/bin/bash", "-c", "--"]
          args:
            - |
              mkdir -p /dev/net
              if [ ! -c /dev/net/tun ]; then mknod /dev/net/tun c 10 200; fi
              apt update && apt install -y iputils-ping iperf3 tmux
              /bin/bash /srsran/config/start_ue.sh 1
          env:
            - name: PATH
              value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/srsran/config"
          volumeMounts:
            - name: ue-config
              mountPath: /srsran/config
        {{- if .Values.channelEmulator.enabled }}
        - name: channel-emulator
          image: "{{ .Values.channelEmulator.image.repository }}:{{ .Values.channelEmulator.image.tag }}"
          imagePullPolicy: {{ .Values.channelEmulator.image.pullPolicy }}
          env:
            - name: GNB_TX_ADDR
              value: "tcp://{{ .Values.gnbIp }}:2000"
            - name: UE_TX_ADDR
              value: "tcp://{{ .Values.ueIp }}:2101"
            - name: GNB_RX_BIND
              value: "tcp://0.0.0.0:2001"
            - name: UE_RX_BIND
              value: "tcp://0.0.0.0:2100"
            - name: DISTANCE_MIN_KM
              value: "{{ .Values.channelEmulator.distanceMinKm }}"
            - name: DISTANCE_MAX_KM
              value: "{{ .Values.channelEmulator.distanceMaxKm }}"
            - name: DOPPLER_MAX_HZ
              value: "{{ .Values.channelEmulator.dopplerMaxHz }}"
            - name: NOISE_FIGURE_DB
              value: "{{ .Values.channelEmulator.noiseFigureDb }}"
        {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: ue-config
          configMap:
            name: {{ include "srsran-ue.fullname" . }}-{{ .Release.Name }}-ue-config
            defaultMode: 0755
