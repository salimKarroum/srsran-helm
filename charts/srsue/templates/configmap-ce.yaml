{{- if .Values.channelEmulator.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srsran-ue.fullname" . }}-{{ .Release.Name }}-ce-code
  labels:
    {{- include "srsran-ue.labels" . | nindent 4 }}
data:
  channel_emulator.py: |
    #!/usr/bin/env python3
    """
    Channel Emulator — DECOUPLED architecture (Phase 1: 1 UE).

    Problem with synchronous bridge: gNB UL requires <1ms response, but a
    reactive bridge (recv gNB REQ -> ask UE -> reply) takes >1ms round-trip,
    causing RF overflow at the gNB. Furthermore, at boot the UE isn't up, so
    the bridge times out (200ms) and the gNB overflows immediately.

    Decoupled design:
      DL (gNB -> UE):
        - 1 fetcher thread: REQ-REP loop pulling from gNB, stores in dl_buffer
        - 1 server thread: REP bind on UE_RX_BIND, serves latest dl_buffer
      UL (UE -> gNB):
        - 1 fetcher thread: REQ-REP loop pulling from UE, stores in ul_buffer
        - 1 server thread: REP bind on GNB_RX_BIND, serves latest ul_buffer
                           (this is the CRITICAL thread — must reply in <1ms)

    Before either source is up, the corresponding buffer holds silence
    (zeros, 1 subframe = 23040 complex64 samples) so the server always has
    something to send.
    """
    import os, time, threading, logging
    import numpy as np
    import zmq

    logging.basicConfig(level=logging.INFO,
                        format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger("channel-emulator")

    GNB_TX_ADDR    = os.getenv("GNB_TX_ADDR",     "tcp://10.10.3.234:2000")
    UE_TX_ADDR     = os.getenv("UE_TX_ADDR",      "tcp://127.0.0.1:2101")
    GNB_RX_BIND    = os.getenv("GNB_RX_BIND",     "tcp://0.0.0.0:2001")
    UE_RX_BIND     = os.getenv("UE_RX_BIND",      "tcp://0.0.0.0:2100")
    SNR_DB         = float(os.getenv("SNR_DB",    "30"))
    SUBFRAME_SAMP  = int(os.getenv("SUBFRAME_SAMPLES", "23040"))
    FETCH_TIMEOUT_MS = int(os.getenv("FETCH_TIMEOUT_MS", "50"))

    SILENCE_BYTES = np.zeros(SUBFRAME_SAMP, dtype=np.complex64).tobytes()

    dl_buffer = SILENCE_BYTES
    ul_buffer = SILENCE_BYTES
    dl_lock = threading.Lock()
    ul_lock = threading.Lock()

    ctx = zmq.Context()

    def awgn(payload_bytes, snr_db):
        if not payload_bytes:
            return payload_bytes
        sig = np.frombuffer(payload_bytes, dtype=np.complex64).copy()
        n = len(sig)
        if n == 0:
            return payload_bytes
        p = 10 ** (-snr_db / 10.0)
        noise = (np.random.randn(n) + 1j * np.random.randn(n)) * np.sqrt(p / 2)
        return (sig + noise).astype(np.complex64).tobytes()

    def make_req(addr):
        s = ctx.socket(zmq.REQ)
        s.setsockopt(zmq.LINGER, 0)
        s.setsockopt(zmq.RCVTIMEO, FETCH_TIMEOUT_MS)
        s.connect(addr)
        return s

    def fetcher(name, addr, lock, set_buffer):
        """Continuously REQ samples from `addr`, store into the shared buffer."""
        s = make_req(addr)
        log.info(f"[{name}-fetch] connected to {addr}")
        last_log = 0
        ok = True
        while True:
            try:
                s.send(b"")
                data = s.recv()
                with lock:
                    set_buffer(data)
                if not ok:
                    log.info(f"[{name}-fetch] {addr} responsive again ({len(data)} B)")
                    ok = True
            except zmq.Again:
                # source silent — recreate socket (REQ state corrupted after send w/o recv)
                if ok and time.time() - last_log > 5:
                    log.warning(f"[{name}-fetch] {addr} not responding")
                    last_log = time.time()
                    ok = False
                s.close()
                s = make_req(addr)
            except Exception as e:
                log.error(f"[{name}-fetch] {e}")
                time.sleep(0.01)

    def dl_set(data):
        global dl_buffer
        dl_buffer = data

    def ul_set(data):
        global ul_buffer
        ul_buffer = data

    def server(name, bind_addr, lock, get_buffer):
        """REP bind; on each REQ from gNB/UE, reply immediately with latest buffer."""
        s = ctx.socket(zmq.REP)
        s.setsockopt(zmq.LINGER, 0)
        s.bind(bind_addr)
        log.info(f"[{name}-srv] bound {bind_addr}")
        while True:
            try:
                s.recv()
                with lock:
                    buf = get_buffer()
                s.send(awgn(buf, SNR_DB))
            except Exception as e:
                log.error(f"[{name}-srv] {e}")
                time.sleep(0.01)

    if __name__ == "__main__":
        log.info(f"Channel emulator (DECOUPLED) — SNR={SNR_DB}dB")
        log.info(f"  DL : fetch {GNB_TX_ADDR} -> serve {UE_RX_BIND}")
        log.info(f"  UL : fetch {UE_TX_ADDR}  -> serve {GNB_RX_BIND}")
        threads = [
            threading.Thread(target=fetcher,
                             args=("DL", GNB_TX_ADDR, dl_lock, dl_set), daemon=True),
            threading.Thread(target=fetcher,
                             args=("UL", UE_TX_ADDR, ul_lock, ul_set), daemon=True),
            threading.Thread(target=server,
                             args=("DL", UE_RX_BIND, dl_lock, lambda: dl_buffer), daemon=True),
            threading.Thread(target=server,
                             args=("UL", GNB_RX_BIND, ul_lock, lambda: ul_buffer), daemon=True),
        ]
        for t in threads:
            t.start()
        while True:
            time.sleep(60)
{{- end }}
