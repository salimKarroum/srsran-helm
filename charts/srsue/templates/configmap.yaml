apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "srsran-ue.fullname" . }}-{{ .Release.Name }}-ue-config
  labels:
    {{- include "srsran-ue.labels" . | nindent 4 }}
data:
  start_ue.sh: |
    #!/bin/bash

    echo "--- Starting UE Configuration Script ---"

    UE_NUM=${1:-1}
    SRSUE=/opt/srsRAN_4G/build/srsue/src/srsue
    CONF=/tmp/ue_${UE_NUM}.conf

    # Kill any stale srsue left from a previous run
    pkill -9 -f "$SRSUE" 2>/dev/null && sleep 1

    # Generate the configuration file
    python3 /srsran/config/generate_ue_conf.py $UE_NUM /tmp/

    apply_net_config() {
      local TUN=tun_srsue
      ip link set dev $TUN mtu 1400
      if ip route show 12.1.0.0/24 dev $TUN > /dev/null 2>&1; then
        ip route del 12.1.0.0/24 dev $TUN
        ip route add 12.1.0.0/16 dev $TUN
      fi
      if ip route show 14.1.0.0/24 dev $TUN > /dev/null 2>&1; then
        ip route del 14.1.0.0/24 dev $TUN
        ip route add 14.1.0.0/16 dev $TUN
      fi
      echo "NET: tun up $(ip addr show $TUN | grep 'inet ' | awk '{print $2}'), routes:"
      ip route
    }

    # Loop: restart srsue whenever it exits (handles gNB restarts which corrupt ZMQ REQ state)
    while true; do
      echo "$(date) Starting srsue (UE ${UE_NUM})..."
      $SRSUE $CONF > /proc/1/fd/1 2>&1 &
      UE_PID=$!

      # Wait up to 100s for tun interface
      for i in $(seq 1 50); do
        if ip addr show tun_srsue 2>/dev/null | grep -q 'inet '; then
          apply_net_config
          break
        fi
        sleep 2
      done

      wait $UE_PID
      EXIT_CODE=$?
      echo "$(date) srsue exited (code $EXIT_CODE), restarting in 5s..."
      sleep 5
    done

  generate_ue_conf.py: |
    #!/usr/bin/env python3
    import argparse
    import os

    UE_TEMPLATE = """[rf]
    freq_offset = 0
    tx_gain = 80
    rx_gain = 40
    srate = 23.04e6
    nof_antennas = 1

    device_name = zmq
    device_args = tx_port={tx_port},rx_port={rx_port},base_srate=23.04e6

    [rat.eutra]
    dl_earfcn = 2850
    nof_carriers = 0

    [rat.nr]
    bands = 3
    nof_carriers = 1
    max_nof_prb = 106
    nof_prb = 106

    [log]
    all_level = warning
    phy_lib_level = none
    all_hex_limit = 32
    filename = {log_file}
    file_max_size = 1000

    [usim]
    mode = soft
    algo = milenage
    opc  = {opc}
    k    = {k}
    imsi = {imsi}
    imei = 356938035643803

    [rrc]
    release = 15
    ue_category = 4

    [nas]
    apn = {apn}
    apn_protocol = ipv4

    [gw]
    # netns removed so the tun interface appears in the pod's network namespace
    ip_devname = tun_srsue
    ip_netmask = 255.255.255.0

    [gui]
    enable = false
    """

    def generate_ue_config(ue_number: int, output_directory: str) -> str:
        os.makedirs(output_directory, exist_ok=True)
        # Values are injected by Helm during deployment
        cfg = UE_TEMPLATE.format(
            tx_port=f"tcp://*:{{ .Values.zmq.tx_port }}",
            rx_port=f"tcp://{{ .Values.gnbIp }}:{{ .Values.zmq.rx_port }}",
            log_file=os.path.join(output_directory, f"ue{ue_number}.log"),
            opc="{{ .Values.usim.opc }}",
            k="{{ .Values.usim.k }}",
            imsi="{{ .Values.usim.imsi }}",
            apn="{{ .Values.usim.apn }}",
        )
        path = os.path.join(output_directory, f"ue_{ue_number}.conf")
        with open(path, "w") as f:
            f.write(cfg)
        print(f"Wrote {path}")
        return path

    if __name__ == '__main__':
        parser = argparse.ArgumentParser(description='Generate srsUE configuration.')
        parser.add_argument('ue_number', type=int)
        parser.add_argument('output_directory', type=str)
        args = parser.parse_args()
        generate_ue_config(args.ue_number, args.output_directory)
