{{- if .Values.channelEmulator.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: channel-emulator-script
  labels:
    {{- include "srsran-ue.labels" . | nindent 4 }}
data:
  channel_emulator.py: |
    #!/usr/bin/env python3
    """
    Hybrid channel emulator:
      DL: synchronous proxy  srsUE-REQ -> gNB-TX -> srsUE  (no overflow)
      UL: buffered           srsUE-TX  -> ul_buf -> gNB     (immediate reply)

    The UL server replies to gNB immediately (zeros if srsUE not yet attached),
    so gNB TX/RX thread is never blocked and can serve DL to srsUE.
    Once srsUE attaches the UL poller fills the buffer with real IQ.
    """
    import os, time, threading, logging
    import numpy as np
    import zmq

    logging.basicConfig(level=logging.INFO,
                        format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger("channel-emulator")

    GNB_TX_ADDR = os.getenv("GNB_TX_ADDR", "tcp://10.10.3.234:2000")
    UE_TX_ADDR  = os.getenv("UE_TX_ADDR",  "tcp://127.0.0.1:2101")
    GNB_RX_BIND = os.getenv("GNB_RX_BIND", "tcp://0.0.0.0:2001")
    UE_RX_BIND  = os.getenv("UE_RX_BIND",  "tcp://0.0.0.0:2100")

    N_SAMPLES = int(os.getenv("N_SAMPLES", "23040"))

    class IQBuffer:
        def __init__(self, n):
            self._lock = threading.Lock()
            self._buf  = np.zeros(n, dtype=np.complex64)

        def put(self, arr):
            with self._lock:
                n = min(len(arr), len(self._buf))
                self._buf[:n] = arr[:n]

        def get(self):
            with self._lock:
                return self._buf.copy()


    def dl_proxy():
        """Synchronous DL: srsUE asks for DL -> proxy asks gNB -> returns IQ.
        gNB TX is only asked after srsUE asks, so gNB rate = srsUE rate = no overflow."""
        ctx = zmq.Context()
        gnb = ctx.socket(zmq.REQ)
        gnb.setsockopt(zmq.LINGER, 0)
        gnb.connect(GNB_TX_ADDR)

        ue = ctx.socket(zmq.REP)
        ue.setsockopt(zmq.LINGER, 0)
        ue.bind(UE_RX_BIND)

        log.info(f"DL proxy ready: {UE_RX_BIND} <-> {GNB_TX_ADDR}")
        count = 0
        t0 = time.time()
        while True:
            try:
                ue.recv()
                gnb.send(b"")
                dl = gnb.recv()
                ue.send(dl)
                count += 1
                if count % 1000 == 0:
                    log.info(f"DL proxy: {count} frames, {count/(time.time()-t0):.0f}/s")
            except Exception as e:
                log.error(f"DL proxy: {e}")
                time.sleep(0.01)


    def ul_poller(ul_buf):
        """Polls srsUE TX for UL IQ. Blocks when srsUE has no samples (before
        attachment), but runs in its own thread so it never blocks the UL server."""
        ctx = zmq.Context()
        req = ctx.socket(zmq.REQ)
        req.setsockopt(zmq.LINGER, 0)
        req.connect(UE_TX_ADDR)
        log.info(f"UL poller: REQ -> {UE_TX_ADDR}")
        while True:
            try:
                req.send(b"")
                raw = req.recv()
                if raw:
                    ul_buf.put(np.frombuffer(raw, dtype=np.complex64).copy())
            except Exception as e:
                log.error(f"UL poller: {e}")
                time.sleep(0.01)


    def ul_server(ul_buf):
        """Serves gNB UL REQ immediately from buffer (zeros until srsUE attaches)."""
        ctx = zmq.Context()
        rep = ctx.socket(zmq.REP)
        rep.setsockopt(zmq.LINGER, 0)
        rep.bind(GNB_RX_BIND)
        log.info(f"UL server: REP bind {GNB_RX_BIND}")
        count = 0
        t0 = time.time()
        while True:
            try:
                rep.recv()
                rep.send(ul_buf.get().tobytes())
                count += 1
                if count % 1000 == 0:
                    log.info(f"UL server: {count} frames, {count/(time.time()-t0):.0f}/s")
            except Exception as e:
                log.error(f"UL server: {e}")
                time.sleep(0.01)


    if __name__ == "__main__":
        log.info("Channel emulator started (hybrid: DL=sync-proxy, UL=buffered)")
        log.info(f"  DL : {GNB_TX_ADDR} -> {UE_RX_BIND}")
        log.info(f"  UL : {UE_TX_ADDR}  -> {GNB_RX_BIND}")

        ul_buf = IQBuffer(N_SAMPLES)

        threads = [
            threading.Thread(target=dl_proxy,                  daemon=True),
            threading.Thread(target=ul_poller, args=(ul_buf,), daemon=True),
            threading.Thread(target=ul_server, args=(ul_buf,), daemon=True),
        ]
        for t in threads:
            t.start()
        for t in threads:
            t.join()
{{- end }}
