{{- if .Values.channelEmulator.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: channel-emulator-script
  labels:
    {{- include "srsran-ue.labels" . | nindent 4 }}
data:
  channel_emulator.py: |
    #!/usr/bin/env python3
    """
    Synchronous ZMQ proxy channel emulator.

    DL: waits for srsUE REQ -> asks gNB TX -> forwards IQ to srsUE
    UL: waits for gNB  REQ -> asks srsUE TX -> forwards IQ to gNB

    Timing is driven by the endpoints themselves, so the gNB runs at
    exactly its natural frame rate with no buffer overflow.
    """
    import os, time, threading, logging
    import numpy as np
    import zmq

    logging.basicConfig(level=logging.INFO,
                        format="%(asctime)s %(levelname)s %(message)s")
    log = logging.getLogger("channel-emulator")

    GNB_TX_ADDR = os.getenv("GNB_TX_ADDR", "tcp://10.10.3.234:2000")
    UE_TX_ADDR  = os.getenv("UE_TX_ADDR",  "tcp://127.0.0.1:2101")
    GNB_RX_BIND = os.getenv("GNB_RX_BIND", "tcp://0.0.0.0:2001")
    UE_RX_BIND  = os.getenv("UE_RX_BIND",  "tcp://0.0.0.0:2100")

    N_SAMPLES = int(os.getenv("N_SAMPLES", "23040"))


    def dl_proxy():
        """DL: srsUE asks for DL -> proxy asks gNB -> forwards IQ."""
        ctx = zmq.Context()
        gnb = ctx.socket(zmq.REQ)
        gnb.setsockopt(zmq.LINGER, 0)
        gnb.connect(GNB_TX_ADDR)

        ue = ctx.socket(zmq.REP)
        ue.setsockopt(zmq.LINGER, 0)
        ue.bind(UE_RX_BIND)

        log.info(f"DL proxy ready: {UE_RX_BIND} <-> {GNB_TX_ADDR}")
        count = 0
        t0 = time.time()
        while True:
            try:
                ue.recv()          # srsUE requests DL samples
                gnb.send(b"")      # ask gNB for DL samples
                dl = gnb.recv()    # receive DL IQ from gNB
                ue.send(dl)        # forward to srsUE
                count += 1
                if count % 1000 == 0:
                    log.info(f"DL proxy: {count} frames, rate={count/(time.time()-t0):.0f}/s")
            except Exception as e:
                log.error(f"DL proxy: {e}")
                time.sleep(0.01)


    def ul_proxy():
        """UL: gNB asks for UL -> proxy asks srsUE -> forwards IQ."""
        ctx = zmq.Context()
        ue = ctx.socket(zmq.REQ)
        ue.setsockopt(zmq.LINGER, 0)
        ue.connect(UE_TX_ADDR)

        gnb = ctx.socket(zmq.REP)
        gnb.setsockopt(zmq.LINGER, 0)
        gnb.bind(GNB_RX_BIND)

        log.info(f"UL proxy ready: {GNB_RX_BIND} <-> {UE_TX_ADDR}")
        count = 0
        t0 = time.time()
        while True:
            try:
                gnb.recv()         # gNB requests UL samples
                ue.send(b"")       # ask srsUE for UL samples
                ul = ue.recv()     # receive UL IQ from srsUE
                gnb.send(ul)       # forward to gNB
                count += 1
                if count % 1000 == 0:
                    log.info(f"UL proxy: {count} frames, rate={count/(time.time()-t0):.0f}/s")
            except Exception as e:
                log.error(f"UL proxy: {e}")
                time.sleep(0.01)


    if __name__ == "__main__":
        log.info("Channel emulator started (synchronous proxy)")
        log.info(f"  DL : {GNB_TX_ADDR} -> {UE_RX_BIND}")
        log.info(f"  UL : {UE_TX_ADDR}  -> {GNB_RX_BIND}")

        threads = [
            threading.Thread(target=dl_proxy, daemon=True),
            threading.Thread(target=ul_proxy, daemon=True),
        ]
        for t in threads:
            t.start()
        for t in threads:
            t.join()
{{- end }}
