# =========================
# srsUE values file for basic ZMQ setup.
# =========================

image:
  repository: ghcr.io/ziyad-mabrouk/srsue
  tag: v1.0
  pullPolicy: IfNotPresent

ueIp: 10.10.3.235
gnbIp: 10.10.3.234

zmq:
  tx_port: 2101   # UE TX REP binds here (gNB RX REQ connects to ueIp:2101)
  rx_port: 2000   # UE RX REQ connects directly to gNB TX REP (gnbIp:2000)

usim:
  opc: C42449363BBAD02B66D16BC975D77CC1
  k: fec86ba6eb707ed08905757b1bb44b8f
  imsi: "001010000000001"
  apn: internet

# Channel emulator sidecar (partage le namespace réseau du pod srsUE)
channelEmulator:
  enabled: false
  image:
    repository: ghcr.io/salimkarroum/channel-emulator
    tag: v1.0
    pullPolicy: Always
  distanceMinKm: "0.5"
  distanceMaxKm: "2.0"
  dopplerMaxHz: "50"
  noiseFigureDb: "7"
