# =========================
# srsUE values file for basic ZMQ setup.
# =========================

image:
  repository: ghcr.io/ziyad-mabrouk/srsue
  tag: v1.0
  pullPolicy: IfNotPresent

ueIp: 10.10.3.232
gnbIp: 10.10.3.231

# Channel emulator sidecar (partage le namespace réseau du pod srsUE)
channelEmulator:
  enabled: true
  image:
    repository: ghcr.io/salimkarroum/channel-emulator
    tag: v1.0
    pullPolicy: Always
  distanceMinKm: "0.5"
  distanceMaxKm: "2.0"
  dopplerMaxHz: "50"
  noiseFigureDb: "7"
