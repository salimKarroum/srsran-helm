# =========================
# srsUE values file for basic ZMQ setup.
# =========================

image:
  repository: ghcr.io/ziyad-mabrouk/srsue
  tag: v1.0
  pullPolicy: IfNotPresent

ueIp: 10.10.3.235
gnbIp: 10.10.3.234

zmq:
  tx_port: 2101   # UE TX REP binds here (channel emulator connects REQ to ueIp:2101)
  rx_port: 2100   # UE RX REQ connects here (channel emulator REP binds UE_RX_BIND :2100)

usim:
  opc: 63BFA50EE6523365FF14C1F45F88737D
  k: 00112233445566778899aabbccddeeff
  imsi: "001010123456780"
  apn: internet

# Channel emulator sidecar (partage le namespace réseau du pod srsUE)
channelEmulator:
  enabled: true
  image:
    repository: ghcr.io/salimkarroum/channel-emulator
    tag: v1.0
    pullPolicy: Always
  distanceMinKm: "0.5"
  distanceMaxKm: "2.0"
  dopplerMaxHz: "50"
  noiseFigureDb: "7"
