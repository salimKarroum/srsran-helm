# =========================
# srsUE values file for basic ZMQ setup.
# =========================

image:
  repository: ghcr.io/ziyad-mabrouk/srsue
  tag: v1.0
  pullPolicy: IfNotPresent

ueIp: 10.10.3.235
gnbIp: 10.10.3.234

# SIM credentials
imsi: "001010000001121"
k: "fec86ba6eb707ed08905757b1bb44b8f"
opc: "C42449363BBAD02B66D16BC975D77CC1"
apn: "internet"

# ZMQ ports (srsUE TX binds REP, RX connects to channel emulator)
zmqTxPort: 2101
zmqRxPort: 2100

# Channel emulator sidecar (partage le namespace réseau du pod srsUE)
channelEmulator:
  enabled: true
  image:
    repository: ghcr.io/salimkarroum/channel-emulator
    tag: v1.0
    pullPolicy: Always
  distanceMinKm: "0.5"
  distanceMaxKm: "2.0"
  dopplerMaxHz: "50"
  noiseFigureDb: "7"
