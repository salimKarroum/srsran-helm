apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "channel-emulator.fullname" . }}
  labels:
    {{- include "channel-emulator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: channel-emulator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: channel-emulator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: channel-emulator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GNB_ZMQ_TX_ADDR
              value: "{{ .Values.gnb.zmqTxAddr }}"
            - name: GNB_ZMQ_RX_ADDR
              value: "{{ .Values.gnb.zmqRxAddr }}"
            - name: UE_ZMQ_TX_ADDR
              value: "{{ .Values.ue.zmqTxAddr }}"
            - name: UE_ZMQ_RX_ADDR
              value: "{{ .Values.ue.zmqRxAddr }}"
            - name: DISTANCE_MIN_KM
              value: "{{ .Values.channel.distanceMinKm }}"
            - name: DISTANCE_MAX_KM
              value: "{{ .Values.channel.distanceMaxKm }}"
            - name: DOPPLER_MAX_HZ
              value: "{{ .Values.channel.dopplerMaxHz }}"
            - name: NOISE_FIGURE_DB
              value: "{{ .Values.channel.noiseFigureDb }}"
            - name: CARRIER_FREQ_GHZ
              value: "{{ .Values.channel.carrierFreqGhz }}"
            - name: RESET_INTERVAL_S
              value: "{{ .Values.channel.resetIntervalS }}"
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
