---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osc-ric.fullname" . }}-redis
  labels:
    {{- include "osc-ric.labels" . | nindent 4 }}
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "osc-ric.fullname" . }}-redis
  template:
    metadata:
      labels:
        app: {{ include "osc-ric.fullname" . }}-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.redis.port }}
---
# Routing Manager (simulé)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osc-ric.fullname" . }}-rtmgr
  labels:
    {{- include "osc-ric.labels" . | nindent 4 }}
    component: rtmgr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "osc-ric.fullname" . }}-rtmgr
  template:
    metadata:
      labels:
        app: {{ include "osc-ric.fullname" . }}-rtmgr
    spec:
      containers:
        - name: rtmgr
          image: python:3.11-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "-c"]
          args:
            - |
              from http.server import HTTPServer, BaseHTTPRequestHandler
              class H(BaseHTTPRequestHandler):
                  def do_GET(self): self.send_response(200); self.end_headers()
                  def do_POST(self): self.send_response(201); self.send_header('Content-Type','application/json'); self.end_headers(); self.wfile.write(b'{}')
                  def do_DELETE(self): self.send_response(200); self.end_headers()
                  def log_message(self, *a): pass
              HTTPServer(('', {{ .Values.rtmgr.port.http }}), H).serve_forever()
          ports:
            - containerPort: {{ .Values.rtmgr.port.http }}
---
# E2 Termination
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osc-ric.fullname" . }}-e2term
  labels:
    {{- include "osc-ric.labels" . | nindent 4 }}
    component: e2term
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "osc-ric.fullname" . }}-e2term
  template:
    metadata:
      labels:
        app: {{ include "osc-ric.fullname" . }}-e2term
    spec:
      containers:
        - name: e2term
          image: "{{ .Values.e2term.image.repository }}:{{ .Values.e2term.image.tag }}"
          imagePullPolicy: {{ .Values.e2term.image.pullPolicy }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "IPC_LOCK"]
          ports:
            - name: sctp
              containerPort: {{ .Values.e2term.port.sctp }}
              protocol: SCTP
            - name: http
              containerPort: {{ .Values.e2term.port.http }}
          env:
            - name: RMR_SEED_RT
              value: "/opt/e2/router.txt"
            - name: DBAAS_SERVICE_HOST
              value: "{{ include "osc-ric.fullname" . }}-redis"
            - name: DBAAS_SERVICE_PORT
              value: "{{ .Values.redis.port }}"
---
# E2 Manager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osc-ric.fullname" . }}-e2mgr
  labels:
    {{- include "osc-ric.labels" . | nindent 4 }}
    component: e2mgr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "osc-ric.fullname" . }}-e2mgr
  template:
    metadata:
      labels:
        app: {{ include "osc-ric.fullname" . }}-e2mgr
    spec:
      containers:
        - name: e2mgr
          image: "{{ .Values.e2mgr.image.repository }}:{{ .Values.e2mgr.image.tag }}"
          imagePullPolicy: {{ .Values.e2mgr.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.e2mgr.port.http }}
          env:
            - name: DBAAS_SERVICE_HOST
              value: "{{ include "osc-ric.fullname" . }}-redis"
            - name: DBAAS_SERVICE_PORT
              value: "{{ .Values.redis.port }}"
            - name: E2TERM_SERVICE_HOST
              value: "{{ include "osc-ric.fullname" . }}-e2term"
            - name: RTMGR_SERVICE_HOST
              value: "{{ include "osc-ric.fullname" . }}-rtmgr"
            - name: RTMGR_SERVICE_PORT
              value: "{{ .Values.rtmgr.port.http }}"
---
# Subscription Manager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osc-ric.fullname" . }}-submgr
  labels:
    {{- include "osc-ric.labels" . | nindent 4 }}
    component: submgr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "osc-ric.fullname" . }}-submgr
  template:
    metadata:
      labels:
        app: {{ include "osc-ric.fullname" . }}-submgr
    spec:
      containers:
        - name: submgr
          image: "{{ .Values.submgr.image.repository }}:{{ .Values.submgr.image.tag }}"
          imagePullPolicy: {{ .Values.submgr.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.submgr.port.http }}
          env:
            - name: RTMGR_SERVICE_HOST
              value: "{{ include "osc-ric.fullname" . }}-rtmgr"
