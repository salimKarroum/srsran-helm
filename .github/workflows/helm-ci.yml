name: Helm Chart CI

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  pull_request:
    paths:
      - 'charts/**'

jobs:
  lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Lint srsran-gnb
        run: helm lint charts/srsran-gnb

      - name: Lint srsue
        run: helm lint charts/srsue

      - name: Lint telegraf
        run: helm lint charts/telegraf

  template:
    name: Validate Chart Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Template srsran-gnb (default values)
        run: helm template srsran-gnb charts/srsran-gnb > /dev/null

      - name: Template srsran-gnb (rfsim values)
        run: helm template srsran-gnb charts/srsran-gnb -f charts/srsran-gnb/values-rfsim.yaml > /dev/null

      - name: Template srsran-gnb (n300 values)
        run: helm template srsran-gnb charts/srsran-gnb -f charts/srsran-gnb/values-n300.yaml > /dev/null

      - name: Template srsran-gnb (n320 values)
        run: helm template srsran-gnb charts/srsran-gnb -f charts/srsran-gnb/values-n320.yaml > /dev/null

      - name: Template srsue
        run: helm template srsue charts/srsue > /dev/null

      - name: Template telegraf
        run: helm template telegraf charts/telegraf > /dev/null

  package:
    name: Package Charts
    runs-on: ubuntu-latest
    needs: [lint, template]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package srsran-gnb
        run: helm package charts/srsran-gnb --destination .dist/

      - name: Package srsue
        run: helm package charts/srsue --destination .dist/

      - name: Package telegraf
        run: helm package charts/telegraf --destination .dist/

      - name: Upload packaged charts
        uses: actions/upload-artifact@v4
        with:
          name: helm-charts
          path: .dist/*.tgz
          retention-days: 7
