# =============================================================================
# Fichier : roles/5g/srsRAN/common/defaults/main.yml
# Remplace/complète le fichier existant dans 5g_ansible
# Ajouts : RIC, xApp RL, channel emulator, 12 UEs
# =============================================================================

repo_url: "https://github.com/salimKarroum/srsran-helm.git"
version: "main"
ran_ns: "{{ core }}"
repo_dest: "~/srsran-helm"
repo_dest_abs: "{{ ansible_env.HOME }}/srsran-helm"

srs_gnb_label_selectors:
  - "app=srsran"
  - "component=gnb"
srs_ue_label_selectors:
  - "app=srsran"
  - "component=ue"

# 12 UEs — 4 par slice (papier REAL)
ue_count: 12

kubectl_bin: "/usr/bin/kubectl"
yq_version: "v4.45.1"
yq_bin_path: "/usr/local/bin/yq"
yq_url: "https://github.com/mikefarah/yq/releases/download/{{ yq_version }}/yq_linux_amd64"

# ── Réseau ───────────────────────────────────────────────────────────────────
srsran_network_map:
  free5gc:
    n2:
      amf_ip: "{% if core_node_name == ran_node_name %}10.100.50.249{% else %}10.100.50.234{% endif %}"
      amf_port: 38412
      gnb_bind_ip: "10.100.50.250"
    n3:
      gnb_ip: "10.100.50.250"
      ue_ips:
        - "10.100.50.251"
        - "10.100.50.252"
        - "10.100.50.253"
  open5gs:
    n2:
      amf_ip: "10.10.3.200"
      gnb_ip: "10.10.3.234"
      amf_port: 38412
      gnb_bind_ip: "10.10.3.234"
    n3:
      amf_ip: "10.10.3.200"
      gnb_ip: "10.10.3.234"
      ue_ips:
        - "10.10.3.235"
        - "10.10.3.236"
        - "10.10.3.237"

srsran_network: "{{ srsran_network_map[core] }}"

free5gc_n3_nad_name: "n3network-free5gc-free5gc-upf"
open5gs_n3_nad_name: "n3network"
n3_nad_name_map:
  free5gc: "{{ free5gc_n3_nad_name }}"
  open5gs: "{{ open5gs_n3_nad_name }}"
n3_nad_name: "{{ n3_nad_name_map[core] }}"
n3networkName_map:
  free5gc: "n3network-free5gc-free5gc-upf"
  open5gs: "n3network"
n3networkName: "{{ n3networkName_map[core] }}"

# =============================================================================
# OSC Near-RT RIC — activer avec -e ric_enabled=true
# =============================================================================

ric_enabled: false

ric_ip: "10.10.3.210"
ric_e2_port: 36421
ric_e2mgr_port: 3800
ric_submgr_port: 8088

# =============================================================================
# RL xApp (PPO ou DQN) — papier REAL
# =============================================================================

# Algorithme : "PPO" ou "DQN"
xapp_rl_algo: "PPO"

# Sampling KPM — 500ms conforme papier REAL
xapp_kpm_sample_ms: 500

# Débits cibles par slice (Mbps)
xapp_embb_target_mbps: 50
xapp_urllc_target_mbps: 20
xapp_mmtc_target_mbps: 5

# Poids α par slice — α_URLLC > α_eMBB ≥ α_mMTC (papier REAL)
xapp_alpha_embb: 0.3
xapp_alpha_urllc: 0.5
xapp_alpha_mmtc: 0.2

# Timesteps d'entraînement
xapp_ppo_timesteps: 1000000
xapp_dqn_timesteps: 1000000

# Intervalle boucle contrôle (secondes)
xapp_ctrl_interval: 0.5

# =============================================================================
# GNU Radio Channel Emulator — activer avec -e channel_emulator_enabled=true
# Conforme papier REAL, section III-B
# =============================================================================

channel_emulator_enabled: false

channel_distance_min_km: 0.5    # distance min UE-gNB (km)
channel_distance_max_km: 2.0    # distance max UE-gNB (km)
channel_doppler_max_hz: 50      # Doppler max (Hz) — mobilité piétonne
channel_noise_figure_db: 7      # facteur de bruit (dB)
